# Gizli bilgi YOK. Anahtarlar sadece .env'de.
mode: paper                 # backtest | paper | live  (TRADING_MODE env bunu ezer)
environment: prod           # prod | demo | testnet    (BINANCE_ENVIRONMENT env ezer)

http:
  timeout_ms: 10000
  retries: 4                # exponential backoff deneme sayısı
  backoff_base_s: 1.0
  backoff_max_s: 30.0
  recv_window_ms: 5000

rate_limit:
  max_weight_per_min: 1200  # Spot REQUEST_WEIGHT limiti (exchangeInfo'dan da okunur)
  safety_ratio: 0.7         # limitin %70'ine ulaşınca yavaşla

universe:
  quote_asset: USDT
  min_quote_volume_24h: 5000000

  max_symbols: 40
  exclude_bases: [USDC, FDUSD, TUSD, USDP, DAI, BUSD, USDE, USD1, PYUSD, AEUR, EUR, EURI, XUSD, RLUSD]

# Skor ağırlıkları (kodda sabit DEĞİL). Başlangıç değerleri ÖNSEL tahmindir, backtest ile (Faz 5) doğrulanacak.
scoring:
  trend_weight: 0.25
  momentum_weight: 0.20
  volume_weight: 0.15
  breakout_weight: 0.15
  volatility_weight: 0.05
  liquidity_weight: 0.20
  risk_weight: 0.25          # ceza katsayısı: skor -= risk_weight * risk_score
  buy_score_threshold: 65
  max_risk_score: 70
  min_strategy_votes: 2
  min_vote_confidence: 0.5

strategy:
  atr_stop_mult: 2.0
  rr1: 1.5
  rr2: 3.0
  momentum_min_pct: 1.5
  breakout_lookback: 20
  volume_breakout_mult: 2.0
  meanrev_z: -2.0
  meanrev_rsi: 30
  squeeze_pctile: 0.2

scanner:
  interval: 1h
  kline_limit: 300
  min_bars: 60
  book_depth: 20
  top_n_report: 10

# Aşağıdakiler Faz 4'te kullanılacak; şimdiden config'te (kod içine gömülmez)
risk:
  max_open_positions: 5
  max_position_size_pct: 0.20
  max_total_exposure_pct: 0.60
  max_daily_loss_pct: 0.03
  max_drawdown_pct: 0.15
  max_risk_per_trade_pct: 0.01
  emergency_stop: false
